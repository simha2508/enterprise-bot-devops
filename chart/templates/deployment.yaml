
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app: enterprise-bot

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: enterprise-bot

  template:
    metadata:
      labels:
        app: enterprise-bot

    spec:
      containers:
        - name: enterprise-bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: APP_NAME

            - name: VERSION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: VERSION

          volumeMounts:
            - name: app-config
              mountPath: /etc/app-config
              readOnly: true

          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: app-config
          configMap:
            name: {{ .Release.Name }}-config
